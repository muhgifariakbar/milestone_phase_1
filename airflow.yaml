x-common:
  &common
  image: retail-airflow
  user: "${AIRFLOW_UID}:0"
  working_dir: /opt/airflow
  env_file:
    - .env.airflow
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./pipelines:/opt/airflow/pipelines
    - ./database:/opt/airflow/database
    - ./shared:/opt/airflow/shared
    - ./data:/opt/airflow/data

x-depends-on:
  &depends-on
  depends_on:
    airflow-postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  airflow-postgres:
    image: postgres:13
    container_name: airflow-postgres
    restart: always
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    env_file:
      - .env.airflow

  scheduler:
    <<: [*common, *depends-on]
    container_name: airflow-scheduler
    command: scheduler
    restart: on-failure

  webserver:
    <<: [*common, *depends-on]
    container_name: airflow-webserver
    restart: always
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 30s
      retries: 5

  airflow-init:
    <<: *common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/plugins
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/logs /opt/airflow/plugins
        exec /entrypoint airflow version
